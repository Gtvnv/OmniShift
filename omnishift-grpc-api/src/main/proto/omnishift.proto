syntax = "proto3";

// Configurações para gerar o código Java
option java_multiple_files = true;
option java_package = "br.com.github.gtvnv.omnishift.infrastructure.adapters.inbound.grpc.generated";
option java_outer_classname = "OmniShiftProto";

package omnishift;

// O nosso serviço (A Porta de Entrada)
service ShiftService {
  // Recebe um request e devolve um response de forma síncrona (Unary RPC)
  rpc ShiftData (ShiftGrpcRequest) returns (ShiftGrpcResponse);

  // Bidirecional: cliente envia o payload em pedaços (contorna o limite padrão
  // de ~4MB por mensagem do gRPC), servidor devolve o resultado também em pedaços.
  // Existe ao lado da RPC unária acima, não a substitui — clientes que não
  // precisam de payloads grandes continuam usando ShiftData normalmente.
  rpc ShiftDataStream (stream ShiftGrpcRequestChunk) returns (stream ShiftGrpcResponseChunk);
}

// O envelope de entrada (Equivalente ao nosso ShiftRequest DTO, mas em Protobuf)
message ShiftGrpcRequest {
  string source_format = 1;
  string target_format = 2;
  string raw_payload = 3;
  string mapping_profile = 4; // opcional: nome de um perfil de mapeamento pré-configurado no servidor
}

// O envelope de saída
message ShiftGrpcResponse {
  string converted_payload = 1;
}

// Mensagem de streaming de entrada: a PRIMEIRA mensagem do stream deve ser
// "metadata"; todas as seguintes devem ser "data_chunk" com pedaços do payload bruto.
message ShiftGrpcRequestChunk {
  oneof payload {
    ShiftGrpcStreamMetadata metadata = 1;
    bytes data_chunk = 2;
  }
}

message ShiftGrpcStreamMetadata {
  string source_format = 1;
  string target_format = 2;
  string mapping_profile = 3; // opcional, mesma convenção de ShiftGrpcRequest (vazio = ausente)
}

// Mensagem de streaming de saída: um ou mais pedaços do payload já convertido.
message ShiftGrpcResponseChunk {
  bytes data_chunk = 1;
}